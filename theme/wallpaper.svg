<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.45" stop-color="#1a1440"/>
      <stop offset="0.8" stop-color="#2d1b69"/>
      <stop offset="1" stop-color="#3b2170"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#4f8ef7" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="960" cy="330" rx="980" ry="420" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <path d="M-80,300 C300,120 620,420 960,260 C1300,100 1620,380 2000,220 L2000,620 C1620,760 1300,520 960,660 C620,800 300,540 -80,700 Z" fill="url(#wave1)"/>
  </g>
  <g filter="url(#soft)">
    <path d="M-80,520 C320,380 700,640 1080,500 C1440,370 1720,620 2000,480 L2000,860 C1640,980 1300,760 960,880 C620,1000 300,780 -80,900 Z" fill="url(#wave2)"/>
  </g>
  <g filter="url(#softer)">
    <path d="M-80,760 C400,620 900,860 1400,740 C1700,680 1880,780 2000,720 L2000,1080 L-80,1080 Z" fill="url(#wave3)"/>
  </g>

  <g fill="#ffffff">
    <circle cx="180" cy="140" r="1.6" opacity="0.8"/>
    <circle cx="420" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="700" cy="180" r="1.4" opacity="0.7"/>
    <circle cx="1020" cy="110" r="1.6" opacity="0.8"/>
    <circle cx="1300" cy="160" r="1.2" opacity="0.6"/>
    <circle cx="1560" cy="100" r="1.5" opacity="0.75"/>
    <circle cx="1760" cy="210" r="1.3" opacity="0.6"/>
    <circle cx="260" cy="260" r="1.1" opacity="0.5"/>
    <circle cx="880" cy="240" r="1.2" opacity="0.55"/>
    <circle cx="1460" cy="300" r="1.1" opacity="0.5"/>
  </g>
</svg>
